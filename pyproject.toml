[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaultkeeper"
version = "0.1.0"
description = "Cross-platform Neverwinter Nights mod installer and manager (successor to the NWN Installer Tool)."
readme = "README.md"
requires-python = ">=3.11,<3.14"  # PySide6 wheels not yet published for 3.14; dev on 3.12/3.13
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "aqzina" }]
keywords = ["neverwinter-nights", "nwn", "mods", "installer", "pyside6"]

# Runtime Python dependencies. Pinned lower-bounds; a lockfile (see below) pins exact versions.
dependencies = [
    "PySide6>=6.7,<6.9",   # Qt for Python (LGPL). GUI toolkit.
    # The NWN file formats and the save editor, split into their own repo. For
    # development install it from a checkout alongside this one:
    #   pip install -e ../nwn-save-editor
    "nwn-save-editor>=0.1",
    "requests>=2.31",       # Neverwinter Vault scraping / downloads.
    "send2trash>=1.8",      # Cross-platform recycle-bin/trash for safe deletes.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pyyaml>=6.0",   # test_ci_workflow.py parses the workflow
    # Pinned, not floated: CI installs the newest match, and a ruff release
    # that changes a rule turns a green repository red with no commit behind
    # it — which is exactly how "clean locally, I001 in CI" happened. Bump
    # this deliberately, with the fixes in the same commit.
    "ruff==0.16.1",
    "mypy>=1.11",
]

[project.gui-scripts]
vaultkeeper = "vaultkeeper.__main__:main"
# nwn-save-editor is a script of the nwn-save-editor package, not of this one.

[tool.hatch.build.targets.wheel]
packages = ["src/vaultkeeper"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Say which packages are ours, rather than leaving ruff to infer it.
#
# nwnfile and nwnsaveeditor live in a separate distribution that happens to be
# installed from a sibling checkout, and ruff versions disagreed about what that
# makes them: one grouped them with vaultkeeper and wanted no blank line between,
# another treated them as third-party and demanded one. The same file was
# therefore clean locally and I001 in CI, with each side's fix breaking the other.
known-first-party = ["vaultkeeper", "tests"]
known-third-party = ["nwnfile", "nwnsaveeditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." as well as "src", so the suite behaves the same whether it is run as
# `pytest` or `python -m pytest` — only the latter puts the working directory on
# sys.path, and CI runs the former.
pythonpath = [".", "src"]
addopts = "-ra"
markers = [
    "unit: fast isolated unit test",
    "integration: exercises real files/multiple components",
]

[tool.mypy]
python_version = "3.11"
packages = ["vaultkeeper"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
