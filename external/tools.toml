# External bundled binaries manifest.
#
# Vaultkeeper shells out to a few native tools. Rather than assume they exist on
# the user's PATH, we declare them here explicitly so the build/packaging step can
# fetch, verify, and bundle a known-good version per platform. A fetch script
# (scripts/fetch_tools.py, added in a later phase) consumes this manifest.
#
# Each tool lists per-platform download URLs + SHA-256 checksums. Licenses are
# recorded for redistribution compliance (both are redistributable).

[sevenzip]
# 7-Zip CLI ("7zz") — archive extraction/compression for installer creation,
# publishing, exports. Replaces the VB app's dependency on 7z.exe (ZipManager).
purpose = "archive extract/compress"
license = "LGPL-2.1 + unRAR restriction"
version = "24.08"
# url/sha256 filled in by the packager per target; kept empty until pinned.
[sevenzip.platforms.macos-arm64]
url = ""
sha256 = ""
[sevenzip.platforms.macos-x86_64]
url = ""
sha256 = ""
[sevenzip.platforms.windows-x86_64]
url = ""
sha256 = ""
[sevenzip.platforms.linux-x86_64]
url = ""
sha256 = ""

[ffmpeg]
# ffmpeg — Bik(.bik) -> WebM(.wbm) movie conversion for NWN:EE (BikToWbm feature).
# Optional at runtime: the movie-conversion feature degrades gracefully if absent.
purpose = "bik->wbm movie conversion"
license = "LGPL-2.1+ (or GPL build; prefer LGPL to allow bundling)"
version = "7.0"
optional = true
[ffmpeg.platforms.macos-arm64]
url = ""
sha256 = ""
[ffmpeg.platforms.macos-x86_64]
url = ""
sha256 = ""
[ffmpeg.platforms.windows-x86_64]
url = ""
sha256 = ""
[ffmpeg.platforms.linux-x86_64]
url = ""
sha256 = ""

# NOTE: ERF/HAK extraction is implemented natively in Vaultkeeper (see the ported
# erf_reader), so — unlike the VB app — we do NOT depend on an external nwhak/ERF
# executable. Recorded here intentionally as a non-dependency.
