<p class="rvps2"><span class="rvts6">Use </span><span class="rvts17">Clear Extracted Hak Portraits</span><span class="rvts6"> to delete the folders containing portrait images extracted from HAK files.</span></p>
<p class="rvps2"><span class="rvts6"><br/></span></p>
<p class="rvps2"><span class="rvts6">A message is displayed that allows you to specify which HAK folders containing portrait images should be deleted.</span></p>
