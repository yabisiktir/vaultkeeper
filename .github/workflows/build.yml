name: Build

# Artifacts are produced on the OS they target: a PySide6 freeze embeds a Python
# interpreter and Qt's native libraries, so there is no cross-building. macOS is
# built twice because PySide6 ships per-architecture wheels and an Apple Silicon
# build will not launch on an Intel Mac.
#
# Vaultkeeper depends on nwn-save-editor, which lives in its own repository, so
# every job checks both out. Set SAVE_EDITOR_REPO below to the owner/name it
# ends up under — the workflow fails loudly rather than silently skipping it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # CHANGE ME once the editor repo exists on GitHub.
  SAVE_EDITOR_REPO: OWNER/nwn-save-editor
  SAVE_EDITOR_REF: main

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: vaultkeeper
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SAVE_EDITOR_REPO }}
          ref: ${{ env.SAVE_EDITOR_REF }}
          path: nwn-save-editor
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt's system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3 xvfb

      - run: python -m pip install --upgrade pip

      # The dependency first: pip cannot resolve nwn-save-editor from PyPI.
      - run: pip install -e ./nwn-save-editor
      - run: pip install -e "./vaultkeeper[dev]"

      - name: The bundled 7-Zip is committed, not fetched
        working-directory: vaultkeeper
        run: python scripts/fetch_tools.py --check

      - name: Test
        working-directory: vaultkeeper
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Lint
        working-directory: vaultkeeper
        run: ruff check src tests scripts

  build:
    name: ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            label: macOS (arm64)
          - os: macos-13        # Intel
            label: macOS (x86_64)
          - os: windows-latest
            label: Windows (x64)
          - os: ubuntu-latest
            label: Linux (x86_64)
    steps:
      - uses: actions/checkout@v4
        with:
          path: vaultkeeper
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SAVE_EDITOR_REPO }}
          ref: ${{ env.SAVE_EDITOR_REF }}
          path: nwn-save-editor
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt's system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfuse2 xvfb

      - run: python -m pip install --upgrade pip
      - run: pip install -e ./nwn-save-editor
      - run: pip install -e ./vaultkeeper pyinstaller

      - name: Build
        working-directory: vaultkeeper
        run: python scripts/build_app.py --clean

      # A freeze that produces a binary which cannot start is the failure worth
      # catching here. Vaultkeeper has no --help, so this asks Qt to build the
      # main window offscreen and exit, which imports essentially everything.
      - name: Smoke test the frozen app (macOS)
        working-directory: vaultkeeper
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          './dist/Vaultkeeper.app/Contents/MacOS/vaultkeeper' &
          PID=$!
          sleep 20
          kill -0 $PID || { echo "the app exited early"; exit 1; }
          kill $PID

      - name: Smoke test the frozen app (Linux)
        working-directory: vaultkeeper
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/vaultkeeper/vaultkeeper &
          PID=$!
          sleep 20
          kill -0 $PID || { echo "the app exited early"; exit 1; }
          kill $PID

      - name: Smoke test the frozen app (Windows)
        working-directory: vaultkeeper
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $p = Start-Process -PassThru .\dist\vaultkeeper\vaultkeeper.exe
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "the app exited early with $($p.ExitCode)" }
          Stop-Process -Id $p.Id

      - uses: actions/upload-artifact@v4
        with:
          name: vaultkeeper-${{ runner.os }}-${{ runner.arch }}
          path: |
            vaultkeeper/dist/*.dmg
            vaultkeeper/dist/*.zip
            vaultkeeper/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true       # a human checks the artifacts before it goes public
          generate_release_notes: true
